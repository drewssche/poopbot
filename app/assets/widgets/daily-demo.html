<main><header><img src="__LOGO__" alt="PoopCheck"><span class="tag">Демо</span></header>
<h2>Кто сегодня какал?</h2><small>__DATE__</small>
<div class="week">__WEEK__</div>
<div class="controls"><button id="minus">−</button><span>Сегодня: <b id="count">1</b></span><button id="plus">+</button></div>
<span id="hint">Тестовые отметки</span></main>
<script>
const w=TelegramWidget, el=id=>document.getElementById(id);
let rev=-1,busy=false;
function paint(raw){
 if(!raw)return;
 const s=JSON.parse(raw);
 if(s.r<rev)return;
 rev=s.r;el('count').textContent=String(s.n);
 el('now').className='dot '+(s.n?'on':'off');el('badge').textContent=String(s.n);
}
async function press(step){
 if(busy||rev<0||w.isForward)return;
 busy=true;el('hint').textContent='Обновляем…';
 try{const a=await w.request('demo:'+rev+':'+step);paint(a.result);el('hint').textContent='Тестовые отметки'}
 catch(e){el('hint').textContent='Нет ответа. Попробуй ещё раз'}
 finally{busy=false}
}
paint(w.chatData);w.onEvent('chatDataChanged',()=>paint(w.chatData));
el('plus').addEventListener('click',()=>press('+'));
el('minus').addEventListener('click',()=>press('-'));
if(w.isForward)el('hint').textContent='Копия · только просмотр';
w.ready()
</script>
