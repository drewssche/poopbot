# Include inside the existing HTTPS server block. Static, isolated demo only.
location = /poopcheck-demo {
    return 301 /poopcheck-demo/;
}
location ^~ /poopcheck-demo/ {
    alias /opt/poopbot/web/demo/;
    index index.html;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me https://*.telegram.me" always;
}

# Owner-only live pilot. Static assets remain shared with the isolated demo.
location = /poopcheck {
    return 301 /poopcheck/;
}
location ^~ /poopcheck/ {
    alias /opt/poopbot/web/live/;
    index index.html;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me https://*.telegram.me" always;
}
location ^~ /poopcheck-api/ {
    proxy_pass http://127.0.0.1:8087/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 15s;
    proxy_connect_timeout 3s;
    client_max_body_size 1k;
    limit_except POST { deny all; }
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
