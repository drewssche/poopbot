# Install in /etc/nginx/conf.d/ (http context), before reloading the site include.
# An allowlist prevents secrets embedded in arbitrary paths from entering logs.
map $uri $poopcheck_audit_route {
    default "unknown_route";
    /poopcheck-api/view "view";
    /poopcheck-api/events "events";
    /poopcheck-api/recover "recover";
    /poopcheck-api/health "health";
}
map $status $poopcheck_audit_failure {
    default 0;
    ~^[45] 1;
}
map $request_method $poopcheck_audit_method {
    default "OTHER";
    GET "GET";
    HEAD "HEAD";
    POST "POST";
    OPTIONS "OPTIONS";
}
log_format poopcheck_security escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"ip":"$remote_addr","method":"$poopcheck_audit_method","route":"$poopcheck_audit_route",'
    '"status":$status,"duration":$request_time}';
