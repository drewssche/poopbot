name: poopbot

services:
  db:
    image: postgres:16
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - poopbot_pgdata:/var/lib/postgresql/data

    # Небольшой тюнинг памяти (актуально для 2GB VPS)
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "work_mem=4MB",
        "-c",
        "maintenance_work_mem=64MB",
        "-c",
        "effective_cache_size=256MB",
        "-c",
        "max_connections=20",
      ]

    mem_limit: 512m
    mem_reservation: 128m

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 60s
      start_interval: 10s

  bot:
    build: .
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    env_file: .env
    environment:
      SECURITY_AUDIT_LOG: /var/log/poopbot-security/bot.jsonl
    volumes:
      - /var/log/poopbot-security/bot:/var/log/poopbot-security

    depends_on:
      db:
        condition: service_healthy

    command: ["sh", "-c", "alembic upgrade head && exec python -m app.supervisor"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 60s

    mem_limit: 512m
    mem_reservation: 128m

  mini-app:
    profiles: ["mini-app"]
    build:
      context: .
      dockerfile: Dockerfile.mini-app
    restart: unless-stopped
    env_file: .env
    environment:
      SECURITY_AUDIT_LOG: /var/log/poopbot-security/mini-app.jsonl
    volumes:
      - /var/log/poopbot-security/mini-app:/var/log/poopbot-security
    command: ["python", "-m", "app.mini_app"]
    ports:
      - "127.0.0.1:8087:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.5
    read_only: true
    user: "65534:65534"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  poopbot_pgdata:
